<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Scanner COPOM Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* Estilo do quadrado de seleção */
        #selector-box {
            position: fixed; border: 2px solid red; background: rgba(255, 0, 0, 0.1);
            cursor: move; z-index: 9999; display: none; resize: both; overflow: auto;
        }
    </style>
</head>
<body class="bg-gray-950 text-white p-6">

    <button id="btn-iniciar" onclick="iniciarConfiguracao()" class="bg-red-600 px-6 py-3 rounded font-bold">
        CONFIGURAR ÁREA DE LEITURA
    </button>

    <div id="selector-box"></div>

    <script>
        const box = document.getElementById('selector-box');
        let stream = null;

        async function iniciarConfiguracao() {
            stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            box.style.display = 'block';
            box.style.width = '300px'; box.style.height = '150px';
            box.style.top = '50px'; box.style.left = '50px';
            
            // Após 5 segundos, ele captura a área definida
            alert("Ajuste o quadrado vermelho sobre as notificações e aguarde.");
            setTimeout(iniciarScanner, 5000);
        }

        async function iniciarScanner() {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();

            setInterval(async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Pega a posição do quadrado na tela
                const rect = box.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;

                // Desenha apenas a parte do vídeo correspondente ao quadrado
                ctx.drawImage(video, rect.left, rect.top, rect.width, rect.height, 0, 0, rect.width, rect.height);

                Tesseract.recognize(canvas, 'por').then(({ data: { text } }) => {
                    if(text.toLowerCase().includes("roubo")) {
                        console.log("Detectado:", text);
                        // Aqui você envia para o seu banco Firebase
                    }
                });
            }, 3000);
        }
    </script>
</body>
</html>
